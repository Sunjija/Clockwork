<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>티크 · 직접 플레이</title>
<style>
:root{color-scheme:dark;--bg:#11171c;--ink:#edf0e9;--muted:#b4c2c5;--accent:#8ee3df;--control:#293c47}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic",sans-serif;min-height:100svh;display:grid;place-items:center}
::selection{background:var(--accent);color:var(--bg)}button{font:inherit;color:inherit;background:var(--control);border:0;border-radius:6px;min-height:44px;padding:8px 14px;cursor:pointer;touch-action:none}button:hover{background:#3b535e}button:active,button[data-held=true]{background:var(--accent);color:var(--bg)}button:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.5;cursor:wait}
main{width:min(100%,1280px,calc((100svh - 136px)*16/9 + 48px));padding:20px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:16px}h1{font-size:16px;font-weight:600;margin:0}header button{background:transparent;color:var(--muted);padding:6px 12px}header button:hover{background:var(--control);color:var(--ink)}
.scene{position:relative;background:#080d10;line-height:0}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none}.notice{position:absolute;inset:0;display:grid;place-content:center;gap:12px;line-height:1.5;text-align:center;background:#11171cf2;padding:24px}.notice[hidden]{display:none}.notice p{margin:0;max-width:40ch}.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;margin:16px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px}.keys li{white-space:nowrap}.keys kbd{font:inherit;font-weight:600;color:var(--ink);margin-right:7px}.touch{display:none;justify-content:space-between;gap:12px;margin-top:16px}.touch-group{display:flex;gap:8px}.touch button{min-width:48px;user-select:none}.touch svg{width:20px;height:20px;display:block}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:700px){main{width:100%;padding:16px 12px}.keys{gap:6px 16px;font-size:12px}.touch{display:flex}.touch button{padding:8px 10px}header{margin-bottom:8px}h1{font-size:14px}}
@media(pointer:coarse){.touch{display:flex}}
@media(max-height:500px) and (min-width:701px){main{max-width:calc((100svh - 112px)*16/9);padding:8px 0}.keys{margin-top:8px}header{margin-bottom:4px}}
</style>
<main>
  <header><h1>티크 · 림부스</h1><button id="reset" title="R 키로도 처음 위치로 돌아갈 수 있어요" disabled>처음 위치로</button></header>
  <div class="scene">
    <canvas id="game" width="640" height="360" tabindex="0" aria-label="티크 플레이 장면" aria-describedby="instructions">브라우저가 Canvas를 지원해야 플레이할 수 있습니다.</canvas>
    <div class="notice" id="notice" role="status"><p id="message">림부스를 불러오는 중…</p><button id="resume" hidden>계속 플레이</button><button id="retry" hidden>다시 불러오기</button></div>
  </div>
  <ul class="keys" id="instructions"><li><kbd>← →</kbd>이동</li><li><kbd>Space / ↑</kbd>점프 · 두 번 누르면 더블점프</li><li><kbd>Shift</kbd>대시</li><li><kbd>J</kbd>공격</li><li><kbd>Esc</kbd>일시정지</li></ul>
  <div class="touch" aria-label="터치 조작">
    <div class="touch-group"><button data-key="ArrowLeft" aria-label="왼쪽으로 이동" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><button data-key="ArrowRight" aria-label="오른쪽으로 이동" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div>
    <div class="touch-group"><button data-key="KeyJ" disabled>공격</button><button data-key="ShiftLeft" disabled>대시</button><button data-key="Space" disabled>점프</button></div>
  </div>
</main>
<script src="Scene/play-controller.js"></script>
<script src="Scene/play-scene.js"></script>
</html>
